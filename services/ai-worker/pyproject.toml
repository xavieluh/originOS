[project]
name = "originos-ai-worker"
version = "0.0.0"
description = "OriginOS research/AI worker (Python). Scaffold only: pipelines arrive in Phases 24-25."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/originos_ai_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
