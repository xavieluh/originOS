# OriginOS CI (Phase 02). Actions are pinned to full commit SHAs; the tag each
# SHA was resolved from (2026-11-22) is in the trailing comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan full git history
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .
      - name: .env files stay untracked
        run: |
          git check-ignore -q .env
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "A .env file is tracked by git" >&2; exit 1
          fi

  node:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # The Python package runs in the "python" job, which has uv installed.
      - run: pnpm turbo run lint --filter='!@originos/ai-worker'
      - run: pnpm turbo run typecheck --filter='!@originos/ai-worker'
      - run: pnpm turbo run test --filter='!@originos/ai-worker'
      - run: pnpm build

  python:
    name: ai-worker (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          working-directory: services/ai-worker
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest

  local-stack:
    name: Local stack (compose, DB and API integration, smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Start Postgres (pgvector), object storage and Mailpit from compose.yaml
        run: |
          cp .env.example .env
          docker compose up -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply migrations to the development database
        run: |
          set -a; . ./.env; set +a
          pnpm db:migrate
      - name: Database (RLS) and API (auth, tenancy) integration tests
        run: |
          set -a; . ./.env; set +a
          pnpm test:integration
      - name: Seed guard (no seed sets yet)
        run: |
          set -a; . ./.env; set +a
          pnpm db:seed
      - name: Smoke test web, api, worker against the database
        run: scripts/smoke.sh
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

  web-e2e:
    name: Web E2E, accessibility and visual (Playwright)
    runs-on: ubuntu-24.04
    # Same image the visual baselines were generated in (ADR-021), so screenshots match.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    # Real Postgres and a mail catcher: sign-up, verification, invitations and
    # password reset run end to end (apps/web/e2e/env.ts reads these URLs).
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: originos
          POSTGRES_PASSWORD: originos-local-only
          POSTGRES_DB: originos_test
        options: >-
          --health-cmd "pg_isready -U originos -d originos_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mail:
        image: axllent/mailpit:v1.34.0
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
          MP_SMTP_AUTH_ALLOW_INSECURE: "true"
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      HOME: /root
      E2E_DATABASE_URL: postgres://originos:originos-local-only@postgres:5432/originos_test
      E2E_SMTP_URL: smtp://mail:1025
      E2E_MAILPIT_URL: http://mail:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@originos/web --filter=@originos/api
      - name: Playwright (auth journeys, routes, dead controls, axe, keyboard, visual)
        working-directory: apps/web
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  supply-chain:
    name: Dependency audit and SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (fails on high or critical)
        run: pnpm audit --prod --audit-level high
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: originos-sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: originos-sbom.cdx.json
          retention-days: 30
